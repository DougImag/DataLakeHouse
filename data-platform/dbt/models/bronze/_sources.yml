version: 2

sources:
  - name: bronze
    description: >
      Données brutes chargées par data-platform/ingest_bronze.py.
      Toutes les colonnes du CSV source sont en VARCHAR, sans transformation.
    database: iceberg
    schema: bronze
    tables:
      - name: frequentation_sncf_v2
        description: >
          Export brut du jeu de données SNCF « Fréquentation en gares »
          (data.sncf.com) : une ligne par gare, une colonne par année.
        columns:
          - name: code_uic_complet
            description: Code UIC de la gare (8 chiffres).
            data_tests:
              - not_null
          - name: nom_gare
            description: Nom de la gare.
          - name: code_postal
            description: Code postal (le zéro initial est parfois absent dans la source).
          - name: source_fichier
            description: Nom du fichier CSV ingéré (colonne technique).
          - name: date_ingestion
            description: Horodatage UTC de l'ingestion (colonne technique).

      - name: gares_voyageurs
        description: >
          Export brut du jeu de données SNCF « Gares de voyageurs »
          (ressources.data.sncf.com, licence ODbL) : une ligne par gare, avec sa
          position GPS. Chargé depuis extraction-data-api/data/gares_voyageurs_raw.csv.
        columns:
          - name: id
            description: Identifiant unique de la gare (UUID).
            data_tests:
              - not_null
          - name: nom
            description: Nom de la gare.
          - name: libellecourt
            description: Trigramme de la gare.
          - name: segment_drg
            description: Segment(s) DRG, séparés par ";" si plusieurs.
          - name: position_geographique
            description: >
              Position "<latitude>, <longitude>" en WGS84 - attention, la
              latitude vient EN PREMIER (format geo_point_2d d'Opendatasoft).
            data_tests:
              - not_null
          - name: codeinsee
            description: Code INSEE de la commune (5 caractères, 2A/2B pour la Corse).
          - name: codes_uic
            description: Code(s) UIC de la gare (8 chiffres), séparés par ";" si plusieurs.
          - name: source_fichier
            description: Nom du fichier CSV ingéré (colonne technique).
          - name: date_ingestion
            description: Horodatage UTC de l'ingestion (colonne technique).
