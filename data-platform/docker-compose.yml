
name: Data-platform

services:
  # --------------------------------------------------
  # Stockage objet compatible S3
  # --------------------------------------------------
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-admin}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --fail http://127.0.0.1:9000/health"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Création du bucket S3
  bucket-init:
    image: amazon/aws-cli:2.37.12
    container_name: bucket-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-admin}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws s3 mb s3://lakehouse --endpoint-url http://rustfs:9000 || true
        aws s3 ls --endpoint-url http://rustfs:9000
    restart: "no"

  # --------------------------------------------------
  # Catalogue Iceberg REST
  # --------------------------------------------------
  polaris:
    image: apache/polaris:latest
    container_name: polaris
    depends_on:
      rustfs:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
    environment:
      POLARIS_BOOTSTRAP_CREDENTIALS: "POLARIS,root,s3cr3t"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-admin}
      quarkus.otel.sdk.disabled: "true"
      polaris.realm-context.realms: POLARIS
    ports:
      - "8181:8181"
      - "8182:8182"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8182/q/health
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # --------------------------------------------------
  # Moteur SQL
  # Nécessite trino/catalog/polaris.properties
  # --------------------------------------------------
  trino:
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-admin}
    image: trinodb/trino:476
    container_name: trino
    depends_on:
      polaris:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    restart: unless-stopped

  # --------------------------------------------------
  # Base PostgreSQL pour les métadonnées Airflow
  # --------------------------------------------------
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-admin}
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --------------------------------------------------
  # Initialisation Airflow
  # --------------------------------------------------
  airflow-init:
    image: apache/airflow:2.10.5
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow_local_password}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: ""
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        (airflow users create
          --username "$$AIRFLOW_ADMIN_USER"
          --password "$$AIRFLOW_ADMIN_PASSWORD"
          --firstname Admin
          --lastname 
          --role Admin
          --email admin@example.com || true)
    restart: "no"

  # --------------------------------------------------
  # Interface Airflow
  # --------------------------------------------------
  airflow-webserver:
    image: apache/airflow:2.10.5
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    command: webserver
    ports:
      - "8081:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # --------------------------------------------------
  # Ordonnanceur Airflow
  # --------------------------------------------------
  airflow-scheduler:
    image: apache/airflow:2.10.5
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
    restart: unless-stopped

volumes:
  rustfs_data:
  postgres_data:
